<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>홍길동 통합 데이터 조회</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            padding: 40px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #2e7d32;
            border-bottom: 2px solid #d4a017;
            padding-bottom: 10px;
            margin-top: 0;
        }
        h3 {
            color: #333;
            margin-top: 25px;
            padding-left: 8px;
            border-left: 4px solid #2e7d32;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 15px;
            border-bottom: 1px solid #eee;
            line-height: 1.6;
            background-color: #fafafa;
            border-radius: 4px;
            margin-bottom: 8px;
        }
        strong {
            color: #111;
        }
        span.id-badge {
            background-color: #eaeaea;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            user-select: all; /* 더블 클릭 시 전체 선택됨 */
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>홍길동 단원 통합 데이터 조회</h2>
        <div id="result">데이터베이스에서 홍길동 단원과 관련된 모든 정보를 추적하는 중입니다...</div>
    </div>

    <script type="module">
        import { db, collection, getDocs, query, where } from "./firebase-config.js?v=20260324_2345";
        
        async function run() {
            try {
                const resultDiv = document.getElementById("result");
                let html = "";

                // 1. users 컬렉션 (가입 계정)
                const qUser = query(collection(db, "users"), where("name", "==", "홍길동"));
                const snapUser = await getDocs(qUser);
                html += "<h3>1. 가입 계정 정보 (users 컬렉션)</h3>";
                if (snapUser.empty) {
                    html += "<p style='color: #666; padding-left: 10px;'>✔️ 가입 정보가 없습니다. (Auth 콘솔과 계정 관리 화면에서 성공적으로 삭제 완료된 상태)</p>";
                } else {
                    html += "<ul>";
                    snapUser.forEach(doc => {
                        const data = doc.data();
                        html += `
                            <li>
                                <strong>성명:</strong> ${data.name} (${data.baptismalName || '성명미상'})<br>
                                <strong>이메일:</strong> ${data.email || '없음'}<br>
                                <strong>로그인 아이디:</strong> ${data.username || '없음'}<br>
                                <strong>문서 고유 ID (이 값을 콘솔에서 검색):</strong> <span class="id-badge" style="color: #2e7d32; font-weight: bold;">${doc.id}</span>
                            </li>
                        `;
                    });
                    html += "</ul>";
                }

                // 2. members_list 컬렉션 (단원 명부)
                const qMem = query(collection(db, "members_list"), where("name", "==", "홍길동"));
                const snapMem = await getDocs(qMem);
                html += "<h3>2. 단원 명부 정보 (members_list 컬렉션)</h3>";
                if (snapMem.empty) {
                    html += "<p style='color: #666; padding-left: 10px;'>✔️ 단원 명부에 등록된 홍길동이 없습니다. (이미 삭제 완료됨)</p>";
                } else {
                    html += "<ul>";
                    snapMem.forEach(doc => {
                        const data = doc.data();
                        html += `
                            <li>
                                <strong>성명:</strong> ${data.name} (${data.baptismalName || '성명미상'})<br>
                                <strong>소속 조직:</strong> ${data.churchName || '-'} ➡️ ${data.curiaName || '-'} ➡️ ${data.presidiumName || '-'}<br>
                                <strong>문서 고유 ID (이 값을 콘솔에서 검색):</strong> <span class="id-badge" style="color: #d4a017; font-weight: bold;">${doc.id}</span>
                            </li>
                        `;
                    });
                    html += "</ul>";
                }

                // 3. officers_list 컬렉션 (간부 이력)
                const qOff = query(collection(db, "officers_list"), where("name", "==", "홍길동"));
                const snapOff = await getDocs(qOff);
                html += "<h3>3. 간부 임기 이력 정보 (officers_list 컬렉션)</h3>";
                if (snapOff.empty) {
                    html += "<p style='color: #666; padding-left: 10px;'>✔️ 간부 이력에 등록된 홍길동이 없습니다. (이미 삭제 완료됨)</p>";
                } else {
                    html += "<ul>";
                    snapOff.forEach(doc => {
                        const data = doc.data();
                        html += `
                            <li>
                                <strong>성명:</strong> ${data.name} (${data.baptismalName || '성명미상'})<br>
                                <strong>임명 직급:</strong> ${data.role || '-'}<br>
                                <strong>소속 조직:</strong> ${data.churchName || '-'} ➡️ ${data.curiaName || '-'} ➡️ ${data.presidiumName || '-'}<br>
                                <strong>문서 고유 ID (이 값을 콘솔에서 검색):</strong> <span class="id-badge" style="color: #dc3545; font-weight: bold;">${doc.id}</span>
                            </li>
                        `;
                    });
                    html += "</ul>";
                }

                resultDiv.innerHTML = html;
            } catch (e) {
                document.getElementById("result").innerHTML = "<strong style='color: #d32f2f;'>에러 발생:</strong> " + e.message;
            }
        }
        run();
    </script>
</body>
</html>
